[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orderstream-auto-heal-deps"
version = "1.0.0"
description = "Automated dependency upgrade assistant that rewrites deprecated API calls to match new major versions and fixes lockfile peer conflicts."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "OrderStream", email = "healthdecoded77@gmail.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.scripts]
auto-heal-deps = "auto_heal_deps.cli:main"
